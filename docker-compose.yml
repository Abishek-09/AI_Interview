version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=interview_platform
      - REDIS_URL=redis://redis:6379
      - FLOWISE_URL=http://flowise:3000
      - FLOWISE_API_KEY=${FLOWISE_API_KEY}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FLOWISE_AGENT_ID=${FLOWISE_AGENT_ID}
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - flowise
      - chromadb

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=interview_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  flowise:
    image: flowiseai/flowise
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
    volumes:
      - flowise_data:/root/.flowise

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  pgdata:
  flowise_data:
  chroma_data:
